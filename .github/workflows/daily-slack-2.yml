name: Daily Slack Message 2 (1차 TM 공지)

on:
  schedule:
    # 05:00 UTC = 14:00 KST (매일 오후 2시 한국시간)
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send fixed message to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_2 }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::error::SLACK_WEBHOOK_URL_2 secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          cat > payload.json <<'EOF'
          {"text":"<!channel>\n*[1차 TM 관련 공지]*\n1차 콜 데이터는 배정 이 후에 컨택 빠르게 해주시고 ,\n해당 페이지에서 컨택 완료 버튼 눌러주세요."}
          EOF
          curl -sS -f -X POST -H 'Content-Type: application/json' --data @payload.json "$SLACK_WEBHOOK_URL"
